spring.application.name=backendUppgift2

# MySQL in Docker
spring.datasource.url=jdbc:mysql://localhost:3306/helpdeskdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Thymeleaf cache during development so HTML edits show immediately
spring.thymeleaf.cache=false
