<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Support Tickets</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h2>Support Tickets</h2>
        <a th:href="@{/tickets/new}" class="btn">+ New Ticket</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Created By</th>
                <th>Assigned To</th>
                <th>Created At</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tickets}">
                <td th:text="'#' + ${t.id}">#1</td>
                <td><strong th:text="${t.title}">Issue title</strong></td>
                <td><span class="badge" th:classappend="'badge-' + ${t.status}" th:text="${t.status}">NEW</span></td>
                <td th:text="${t.createdBy.fullName}">User</td>
                <td th:text="${t.assignedTo != null ? t.assignedTo.fullName : 'Unassigned'}">Unassigned</td>
                <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                <td><a th:href="@{/tickets/{id}(id=${t.id})}" class="btn btn-secondary btn-sm">View</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(tickets)}">
                <td colspan="7" style="text-align: center; color: #64748b; padding: 24px;">No tickets found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
