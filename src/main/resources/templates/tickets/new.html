<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>New Support Ticket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-sm">
    <div class="card">
        <h2>Create New Ticket</h2>
        <form th:action="@{/tickets}" th:object="${ticket}" method="post">
            <div class="form-group">
                <label>Title</label>
                <input type="text" th:field="*{title}" placeholder="Brief summary of the issue" required />
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" rows="6" placeholder="Describe your problem in detail..." required></textarea>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn">Submit Ticket</button>
                <a th:href="@{/tickets}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
